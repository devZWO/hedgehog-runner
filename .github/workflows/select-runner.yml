# Generated from src/selection.mjs by scripts/selection-workflow.mjs.
# Run npm run workflow:check to detect stale embedded selection code.
name: Select Hedgehog runner

on:
  workflow_call:
    inputs:
      owner-id:
        description: Numeric PR-author GitHub ID (normally vars.RUNNER_OWNER_ID).
        type: string
        default: ''
      labels:
        description: JSON array of all required labels, including self-hosted.
        type: string
        required: true
      fallback:
        description: Hosted ubuntu-*, windows-* or macos-* label.
        type: string
        default: ubuntu-latest
    secrets:
      app-id:
        required: false
      app-private-key:
        required: false
    outputs:
      runs-on:
        description: JSON hosted runner string or array of self-hosted labels.
        value: ${{ jobs.select.outputs.runs-on }}
      reason:
        description: Explanation of the selection, without API credentials.
        value: ${{ jobs.select.outputs.reason }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Check event and owner eligibility
        id: preflight
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OWNER_ID: ${{ inputs.owner-id }}
          RUNNER_LABELS: ${{ inputs.labels }}
          HOSTED_FALLBACK: ${{ inputs.fallback }}
          APP_CONFIGURED: ${{ secrets.app-id != '' && secrets.app-private-key != '' }}
        with:
          script: |
            const selectionRequest = function selectionRequest({ eventName, repository, authorId, headRepository, ownerId, labels, fallback = 'ubuntu-latest' }) {
                const validFallback = typeof fallback === 'string' && /^(?:ubuntu|windows|macos)-[a-z\d][a-z\d.-]*$/i.test(fallback);
                const request = { eligible: false, labels: [], fallback: validFallback ? fallback : 'ubuntu-latest', reason: '' };
                if (!validFallback) return { ...request, reason: 'Invalid hosted fallback; using ubuntu-latest.' };
                let parsed;
                try { parsed = typeof labels === 'string' ? JSON.parse(labels) : labels; } catch { /* Fail closed below. */ }
                if (!Array.isArray(parsed) || !parsed.length || parsed.some((label) => typeof label !== 'string'
                    || !/^[a-z\d][a-z\d_.-]{0,62}$/i.test(label))
                    || new Set(parsed.map((label) => label.toLowerCase())).size !== parsed.length
                    || !parsed.some((label) => label.toLowerCase() === 'self-hosted')) {
                    return { ...request, reason: 'Invalid self-hosted runner labels; using hosted fallback.' };
                }
                request.labels = parsed;
                if (eventName !== 'pull_request') return { ...request, reason: 'Event is not pull_request.' };
                if (typeof repository !== 'string' || !/^[a-z\d][a-z\d-]*\/[a-z\d_.-]+$/i.test(repository)
                    || headRepository !== repository) return { ...request, reason: 'PR does not originate in the caller repository.' };
                if (!/^[1-9]\d*$/.test(String(ownerId ?? '')) || !Number.isSafeInteger(Number(ownerId))) {
                    return { ...request, reason: 'RUNNER_OWNER_ID is missing or invalid.' };
                }
                if (String(authorId) !== String(ownerId)) return { ...request, reason: 'PR author does not match RUNNER_OWNER_ID.' };
                return { ...request, eligible: true, reason: 'Same-repository owner PR is eligible for self-hosted selection.' };
            };
            const request = selectionRequest({
                eventName: context.eventName,
                repository: context.repo.owner + '/' + context.repo.repo,
                authorId: context.payload.pull_request?.user?.id,
                headRepository: context.payload.pull_request?.head?.repo?.full_name,
                ownerId: process.env.OWNER_ID,
                labels: process.env.RUNNER_LABELS,
                fallback: process.env.HOSTED_FALLBACK,
            });
            core.setOutput('request', JSON.stringify(request));
            core.setOutput('eligible', String(request.eligible));
            core.setOutput('app-configured', process.env.APP_CONFIGURED);

      - name: Create repository-scoped runner-read token
        id: app-token
        if: steps.preflight.outputs.eligible == 'true' && steps.preflight.outputs.app-configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Select available runner or hosted fallback
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SELECTION_REQUEST: ${{ steps.preflight.outputs.request }}
          CREDENTIALS_AVAILABLE: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token != '' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const selectRunner = async function selectRunner(request, { credentialsAvailable, listRunners }) {
                const hosted = (reason) => ({ runsOn: request.fallback, reason });
                if (!request.eligible) return hosted(request.reason);
                if (!credentialsAvailable) return hosted('Runner-read credentials are unavailable; using hosted fallback.');
                try {
                    const runners = await listRunners();
                    if (!Array.isArray(runners)) return hosted('Invalid runner API response; using hosted fallback.');
                    const available = runners.some((runner) => runner?.status === 'online' && runner.busy === false
                        && Array.isArray(runner.labels) && request.labels.every((label) => runner.labels.some((entry) =>
                            typeof entry?.name === 'string' && entry.name.toLowerCase() === label.toLowerCase())));
                    return available
                        ? { runsOn: request.labels, reason: 'An online, idle runner has all required labels.' }
                        : hosted('No online, idle runner has all required labels; using hosted fallback.');
                } catch {
                    // Do not expose API errors, request headers or credentials in logs/outputs.
                    return hosted('Runner availability query failed; using hosted fallback.');
                }
            };
            const request = JSON.parse(process.env.SELECTION_REQUEST);
            const result = await selectRunner(request, {
                credentialsAvailable: process.env.CREDENTIALS_AVAILABLE === 'true',
                listRunners: () => github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {
                    ...context.repo, per_page: 100,
                }),
            });
            core.setOutput('runs-on', JSON.stringify(result.runsOn));
            core.setOutput('reason', result.reason);
            core.info(result.reason);
